<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oli — Offline</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0D1117;color:#F0F6FC;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
    .logo{width:56px;height:56px;background:#2EA043;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:28px}
    h1{font-size:22px;font-weight:700;margin-bottom:8px}
    p{font-size:14px;color:#8B949E;line-height:1.6;max-width:280px;margin:0 auto 24px}
    button{background:#2EA043;color:#fff;border:none;border-radius:24px;padding:12px 28px;font-size:14px;font-weight:600;cursor:pointer}
    button:active{opacity:0.85}
  </style>
</head>
<body>
  <div class="logo">🌿</div>
  <h1>You're offline</h1>
  <p>Connect to the internet to use Oli. Your cached fields and recent data will be available once you're back online.</p>
  <button onclick="window.location.reload()">Try again</button>
</body>
</html>
